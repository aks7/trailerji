# Spring Boot Application Configuration
spring:
  application:
    name: movie-trailer-backend
  config:
    import: classpath:application-secrets.yaml
  # Database Configuration
  datasource:
    # Notice the single quotes at the start/end, and the \; between the commands
    #url: 'jdbc:h2:mem:trailerji_db;INIT=CREATE SCHEMA IF NOT EXISTS trailerji_db\;SET SCHEMA trailerji_db'
    #driverClassName: org.h2.Driver
    #username: sa
    #password:

    # Commented-out PostgresQL Configuration
     url: jdbc:postgresql://localhost:5432/postgres
     username: ${DB_USERNAME}
     password: ${DB_PASSWORD}
     driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # dialect: org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server:
  port: 8080

# Custom Application Configurations (JWT & CORS)
app:
  jwt:
    secret: movieTrailerSecretKeyForJWTTokenGeneration2025
    expiration: 86400000
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001

# Third-Party API Configurations
youtube:
  api:
    key: ${YOUTUBE_API_KEY}

tmdb:
  api:
    key: ${TMDB_API_KEY}

# Logging Configuration
logging:
  level:
    com:
      movietrailers: DEBUG
    org:
      springframework:
        security: DEBUG

# Cache Configuration
cache:
  refresh:
    interval:
      ms: 3600000 # 1 hour in milliseconds

kind: Application